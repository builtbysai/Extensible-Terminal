<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="924" viewBox="0 0 1000 924" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .serif { font-family: Georgia, 'Times New Roman', serif; }
    </style>
  </defs>

  <!-- paper -->
  <rect x="1" y="1" width="998" height="922" rx="14" fill="#f6f3ec" stroke="#d9d2c0" stroke-width="2"/>

  <!-- header -->
  <text x="64" y="52" fill="#71665a" font-size="12" letter-spacing="3.5" class="mono">EXTENSIBLE TERMINAL</text>
  <text x="64" y="112" fill="#201d18" font-size="46" class="serif">Runtime stack.</text>
  <text x="64" y="142" fill="#71665a" font-size="13.5">a minimal terminal runtime &#183; rxi/lite-inspired small-core philosophy &#183; Rust</text>

  <!-- MVP badge -->
  <g>
    <rect x="792" y="28" width="144" height="34" rx="17" fill="none" stroke="#b8431f" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="864" y="50" text-anchor="middle" fill="#b8431f" font-size="12.5" class="mono">MVP &#183; experiment</text>
  </g>

  <!-- guiding line -->
  <text x="64" y="186" fill="#201d18" font-size="13" font-weight="600">correctness in the core</text>
  <text x="248" y="186" fill="#71665a" font-size="13">everything else is an optional layer &#183; bytes flow down, the emulated grid flows up</text>

  <!-- configures rail: user-config -> terminal-cli -->
  <line x1="40" y1="770" x2="40" y2="290" stroke="#a89c88" stroke-width="1.2" stroke-dasharray="5 4"/>
  <polygon points="40,282 35,292 45,292" fill="#a89c88"/>
  <rect x="28" y="452" width="24" height="164" fill="#f6f3ec"/>
  <text x="40" y="534" transform="rotate(-90 40 534)" text-anchor="middle" fill="#71665a" font-size="10.5" letter-spacing="1.5" class="mono">configures terminal-cli</text>

  <!-- LAYER 01 : terminal-cli -->
  <g>
    <rect x="64" y="208" width="872" height="150" rx="10" fill="#fffdf8" stroke="#d9d2c0" stroke-width="1.5"/>
    <rect x="64" y="208" width="5" height="150" rx="2.5" fill="#b8431f"/>
    <text x="96" y="246" fill="#8a8072" font-size="11" class="mono">01</text>
    <text x="126" y="246" fill="#201d18" font-size="16" font-weight="700" class="mono">terminal-cli</text>
    <text x="252" y="246" fill="#71665a" font-size="12.5">runnable cross-platform raw-mode frontend</text>
    <text x="880" y="246" text-anchor="end" fill="#8a8072" font-size="11" class="mono">in: grid cells &#183; out: terminal bytes</text>
    <text x="96" y="278" fill="#4a443b" font-size="13">PTY output is parsed into <tspan class="mono">TerminalState</tspan> and rendered from the emulated grid;</text>
    <text x="96" y="300" fill="#4a443b" font-size="13">keyboard input is translated to terminal bytes, resize propagates to endpoint and grid.</text>
    <text x="96" y="330" fill="#71665a" font-size="12" class="mono">--ssh TARGET &#183; --tmux SESSION &#183; --config PATH</text>
  </g>

  <!-- LAYER 02 : terminal-core -->
  <g>
    <rect x="64" y="374" width="872" height="172" rx="10" fill="#fffdf8" stroke="#d9d2c0" stroke-width="1.5"/>
    <rect x="64" y="374" width="5" height="172" rx="2.5" fill="#b8431f"/>
    <text x="96" y="412" fill="#8a8072" font-size="11" class="mono">02</text>
    <text x="126" y="412" fill="#201d18" font-size="16" font-weight="700" class="mono">terminal-core</text>
    <text x="262" y="412" fill="#71665a" font-size="12.5">the compact Rust core &#8212; correctness lives here</text>
    <text x="880" y="412" text-anchor="end" fill="#8a8072" font-size="11" class="mono">bytes &#8594; TerminalState</text>
    <text x="96" y="444" fill="#4a443b" font-size="13"><tspan class="mono">Endpoint + Surface + Command + Annotation</tspan> &#183; bounded observer delivery</text>
    <text x="96" y="466" fill="#4a443b" font-size="13">capability-scoped extensions &#183; declarative composition &#183; TERM/terminfo diagnostics</text>
    <text x="96" y="498" fill="#4a443b" font-size="13">VT state/grid: primary + alternate screens &#183; DECSTBM/DECOM &#183; SGR &#183; bounded scrollback</text>
    <text x="96" y="520" fill="#4a443b" font-size="13">incremental UTF-8 &#183; resize preservation &#183; xterm mouse-mode negotiation</text>
  </g>

  <!-- LAYER 03 : local-pty -->
  <g>
    <rect x="64" y="562" width="872" height="150" rx="10" fill="#fffdf8" stroke="#d9d2c0" stroke-width="1.5"/>
    <rect x="64" y="562" width="5" height="150" rx="2.5" fill="#b8431f"/>
    <text x="96" y="600" fill="#8a8072" font-size="11" class="mono">03</text>
    <text x="126" y="600" fill="#201d18" font-size="16" font-weight="700" class="mono">local-pty</text>
    <text x="218" y="600" fill="#71665a" font-size="12.5">native PTY / ConPTY endpoints via portable-pty</text>
    <text x="880" y="600" text-anchor="end" fill="#8a8072" font-size="11" class="mono">raw bytes only</text>
    <text x="96" y="632" fill="#4a443b" font-size="13">raw bytes, resize, process lifecycle and exit metadata &#8212; nothing more</text>
    <text x="96" y="654" fill="#4a443b" font-size="13"><tspan class="mono">SshPtyEndpoint</tspan> runs your system OpenSSH client inside the native PTY</text>
    <text x="96" y="676" fill="#4a443b" font-size="13"><tspan class="mono">TmuxPtyEndpoint</tspan> runs your installed tmux client &#8212; attach-or-create session semantics</text>
  </g>

  <!-- user-config : optional trusted layer -->
  <g>
    <rect x="64" y="728" width="872" height="76" rx="10" fill="#f6f3ec" stroke="#a89c88" stroke-width="1.2" stroke-dasharray="7 5"/>
    <text x="96" y="758" fill="#201d18" font-size="14" font-weight="700" class="mono">user-config</text>
    <text x="210" y="758" fill="#71665a" font-size="12.5">trusted user Lua &#8212; a privileged origin, never the third-party plugin API</text>
    <text x="96" y="782" fill="#71665a" font-size="12.5" class="mono">optional layer: shell &#183; env &#183; initial dimensions</text>
    <text x="880" y="782" text-anchor="end" fill="#8a8072" font-size="11" class="mono">trusted, not extensible</text>
  </g>

  <!-- footer -->
  <line x1="64" y1="832" x2="936" y2="832" stroke="#d9d2c0" stroke-width="1"/>
  <text x="64" y="856" fill="#201d18" font-size="12.5" font-weight="600">deliberately not reimplemented</text>
  <text x="64" y="876" fill="#71665a" font-size="12.5">SSH transport &amp; authentication stay owned by the installed OpenSSH client &#183; tmux server behavior stays owned by the installed tmux program</text>
  <text x="64" y="904" fill="#8a8072" font-size="11.5" class="mono">crates: terminal-core &#183; local-pty &#183; user-config &#183; terminal-cli</text>
  <text x="936" y="904" text-anchor="end" fill="#8a8072" font-size="11.5" class="mono">cargo build --workspace --locked</text>
</svg>
